* { box-sizing:border-box }
body { margin:0; background:#faf9f4; color:#141515; font-family:"DejaVu Sans",WelcomeTC,sans-serif }
main { height:100vh; display:grid; grid-template-rows:75% 25% }
.poster { min-height:0; padding:4vh 4.5vw 1.8vh; display:grid; grid-template-rows:auto minmax(0,1fr) }
header { display:flex; align-items:center; justify-content:space-between; padding-bottom:2vh; border-bottom:2px solid #191b1c }
.brand { display:inline-flex; align-items:center; gap:.38em; font:700 2.15vw/1 BrandDM,sans-serif; letter-spacing:-.048em }
.mark { display:block; width:1.36em; height:auto }
.clock { display:grid; text-align:right; gap:.2em; font:bold 1.6vw/1.1 "DejaVu Sans Mono",monospace }
.clock small { font-size:.83vw; letter-spacing:.13em; color:#365271 }
a { color:inherit; text-decoration:none }
.stack { display:grid; gap:.6vh }
.eyebrow { font:bold 1.05vw "DejaVu Sans Mono",monospace; letter-spacing:.11em }
.entry { background:#17222b; color:#faf9f4; display:grid; grid-template-columns:41% 59%; align-items:center; padding:0 4.5vw }
.entry .eyebrow { color:#c5d6df }
.entry strong { font-size:3vw; line-height:1.3 }
.visitor { display:flex; align-items:center; gap:1.6vw; border-left:1px solid #8b9aa3; padding-left:3.7vw; justify-content:space-between }
.visitor svg { display:block; flex:none; width:9vw; height:9vw; shape-rendering:crispEdges }
.id { font:bold 1.65vw "DejaVu Sans Mono",monospace; color:#9aebb7 }
/* These compositions also work with the Pi's injected panel-protection rules. */
body[data-board="welcome"] .hero { display:flex; min-height:0; position:relative; align-items:center }
body[data-board="welcome"] .hero .copy { width:100%; min-width:0; align-self:center }
.course-label { display:flex; align-items:center; gap:1.3vw; font-size:1.65vw; font-weight:700; letter-spacing:.12em; margin-bottom:3.5vh }
.course-label time { font:bold 2.1vw "DejaVu Sans Mono",monospace; letter-spacing:-.05em; border-right:1px solid currentColor; padding-right:1.3vw }
h1 { margin:0; font-size:8.5vw; font-weight:700; line-height:1.2; letter-spacing:.02em; white-space:nowrap }
.welcome-line { margin:3vh 0 0; font-size:2.2vw; line-height:1.5; letter-spacing:.08em }
body[data-board="welcome"] .hero .art { display:none }
body[data-board="welcome"][data-panel-layout="mirror"] .hero .copy { text-align:right }
body[data-board="welcome"][data-panel-layout="mirror"] .course-label { justify-content:flex-end }

<script>
(() => {
  'use strict';
  const courseDay = '2026-11-08';
  const clock = document.getElementById('local-clock');
  const label = document.getElementById('board-label');
  const title = document.getElementById('board-title');
  const welcome = document.getElementById('welcome-line');
  const dayFormat = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'});
  const clockFormat = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  let lastDay;
  function update() {
    const now = new Date();
    const day = dayFormat.format(now);
    clock.textContent = clockFormat.format(now);
    clock.dateTime = now.toISOString();
    if (day !== lastDay) {
      lastDay = day;
      const course = day === courseDay;
      document.body.dataset.course = String(course);
      label.innerHTML = course ? '<time datetime="2026-11-08">11.08</time><span>今日課程</span>' : '<span>WELCOME TO MONOSPACE</span>';
      title.textContent = course ? '雙手牌工作室' : 'monospace';
      welcome.textContent = course ? (document.body.dataset.role === 'reception' ? '很高興今天與你相聚' : '歡迎來到 Monospace') : '你的工作、交流與創作基地';
      document.title = course ? '雙手牌工作室｜今日課程 · Monospace' : '歡迎來到 Monospace';
    }
    setTimeout(update, 1000 - Date.now() % 1000);
  }
  update();
})();
</script>
