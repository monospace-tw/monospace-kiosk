*{box-sizing:border-box}
body{margin:0;background:#faf9f4;color:#141515;font-family:"DejaVu Sans",PosterTC,sans-serif}
main{height:100vh;display:grid;grid-template-rows:75% 25%}
.poster{min-height:0;padding:4vh 4.5vw 1.8vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:2vh;border-bottom:2px solid #191b1c}
.brand{font-size:2.15vw;font-weight:bold;letter-spacing:-.075em}
.date{font:600 1.55vw "DejaVu Sans Mono",PosterTC,monospace}
.hero{display:grid;grid-template-columns:50% 50%;min-height:0}
.copy{align-self:center}
h1{font-size:7.65vw;line-height:.96;letter-spacing:-.08em;margin:0}
h1 span{display:block;font-size:.405em;letter-spacing:-.05em;line-height:1.5;margin-bottom:.35em}
.art{position:relative;overflow:hidden;align-self:stretch}
.art svg{width:100%;height:100%;display:block;overflow:visible}
.sheet{position:absolute;inset:0}
.art .float,.art .nod,.art .hop{will-change:transform}
.art .float{animation:sway 3.6s ease-in-out -1s infinite alternate}
.art .nod{animation:nod 2.7s ease-in-out -.4s infinite alternate}
.art .hop{animation:hop 3.2s infinite;transform-origin:47% 71%}
@keyframes sway{from{transform:translate(-1.1vw,.55vw) rotate(-3deg)}to{transform:translate(1.1vw,-.75vw) rotate(3deg)}}
@keyframes nod{from{transform:translate(-.65vw,-.55vw) rotate(-3deg)}to{transform:translate(.8vw,1vw) rotate(2deg)}}
@keyframes hop{0%,65%,100%{transform:translateY(.45vw) scale(1);animation-timing-function:ease-out}24%{transform:translateY(-1.8vw) scale(1.025);animation-timing-function:ease-in}49%{transform:translateY(.45vw) scale(1.035,.97);animation-timing-function:ease-out}}
@media(prefers-reduced-motion:reduce){.art .sheet{animation:none;will-change:auto}}

h1{font-size:6.65vw}h1 span{font-size:.35em;margin-bottom:.35em}.date{font-weight:bold;letter-spacing:.025em}.date i{font-style:normal;border-left:2px solid #949793;padding-left:1.05em;margin-left:1.05em}
a{color:inherit;text-decoration:none}
.ticket,.visitor{display:flex;align-items:center;gap:1.6vw}
.ticket{width:fit-content;margin-top:2.6vh}.ticket svg,.visitor svg{display:block;flex:none;shape-rendering:crispEdges;width:7.71vw;height:7.71vw}.ticket svg{outline:1px solid #b8b9b4}
.stack{display:grid;gap:.6vh}
.eyebrow{font: bold 1.05vw "DejaVu Sans Mono",monospace;letter-spacing:.11em}
.ticket .eyebrow{color:#284aab}.ticket strong{font-size:2.1vw;line-height:1.24}
.entry{background:#17222b;color:#faf9f4;display:grid;grid-template-columns:41% 59%;align-items:center;padding:0 4.5vw}
.entry .eyebrow{color:#c5d6df}.entry strong{font-size:3vw;line-height:1.3}
.visitor{border-left:1px solid #8b9aa3;padding-left:3.7vw;justify-content:space-between}.visitor svg{width:9vw;height:9vw}

<script>
(function(){
  var type=document.querySelector('.type'), phrase=type.textContent, count=document.querySelector('.count'), total=count.textContent, timer;
  var motion=matchMedia('(prefers-reduced-motion: no-preference)');
  var headline=document.querySelector('.drift');
  var letters=0;
  var deleting=false;
  function typeNext(){
    type.textContent=phrase.slice(0,letters);
    if(letters===phrase.length && !deleting){
      type.className='type';
      headline.classList.add('moving');
      return;
    }
    type.className='type typing';
    if(letters===0) deleting=false;
    letters+=deleting?-1:1;
    timer=setTimeout(typeNext,deleting?34:92);
  }
  headline.addEventListener('animationend',function(event){
    if(event.animationName!=='drift' || !motion.matches) return;
    headline.classList.remove('moving');
    deleting=true;
    typeNext();
  });
  function run(){
    headline.classList.remove('moving');
    letters=0;
    deleting=false;
    clearTimeout(timer); type.textContent=phrase; type.className='type'; count.textContent=total;
    if(!motion.matches)return;
    count.setAttribute('aria-label',total);
    count.textContent='';
    total.split('').forEach(function(n,i){
      var digit=document.createElement('span'), reel=document.createElement('span'), steps=3+i*3;
      digit.className='digit'; digit.setAttribute('aria-hidden','true'); reel.className='reel';
      for(var j=0;j<=steps;j++){var b=document.createElement('b');b.textContent=(Number(n)-steps+j+10*total.length)%10;reel.appendChild(b);}
      reel.style.marginTop=-steps+'em';reel.style.setProperty('--start',steps+'em');reel.style.setProperty('--lag',(.16+i*.09)+'s');
      digit.appendChild(reel);count.appendChild(digit);
    });
    typeNext();
  }
  run();motion.addListener(run);
})();
